name: bilight
services:
  bilight:
    build: .
    image: bilight:local
    container_name: bilight
    init: true
    restart: unless-stopped
    labels:
      dev.orbstack.domains: bilibili.local
      dev.orbstack.http-port: "3880"
    ports:
      - "127.0.0.1:3880:3880"
    volumes:
      - bilight_data:/data
    secrets:
      - master_key
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3880/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
secrets:
  master_key:
    file: ${BILIGHT_MASTER_KEY_FILE:-../Local/secrets/master-key}
volumes:
  bilight_data:
