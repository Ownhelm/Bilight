name: Bilight
options:
  bundleIdPrefix: app.bilight
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Bilight:
    type: application
    platform: iOS
    sources:
      - path: Bilight
    info:
      path: Bilight/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleDisplayName: Bilight
        CFBundleShortVersionString: '0.1.2'
        CFBundleVersion: '3'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            '127.0.0.1':
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: app.bilight.video
            CFBundleURLSchemes: [bilight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bilight.ios
        CODE_SIGN_ENTITLEMENTS: Bilight/Bilight.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        GENERATE_INFOPLIST_FILE: NO
  BilightTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BilightTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Bilight
  BilightUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BilightUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Bilight
schemes:
  BilightInteractionTests:
    build:
      targets:
        Bilight: all
        BilightUITests: [test]
    test:
      targets: [BilightUITests]
  Bilight:
    build:
      targets:
        Bilight: all
        BilightTests: [test]
    test:
      environmentVariables:
        BILIGHT_ISOLATED_TESTS: '1'
      targets: [BilightTests]
  BilightLiveSmoke:
    build:
      targets:
        Bilight: all
        BilightTests: [test]
    test:
      environmentVariables:
        BILIGHT_ISOLATED_TESTS: '1'
        BILIGHT_LIVE_SMOKE: '1'
      targets:
        - name: BilightTests
          selectedTests: [LiveSmokeTests/testRealNativeAVCAACPlaybackAndSeeking, LiveSmokeTests/testRealSegmentedDASHVideoAudioAndSeeking, LiveSmokeTests/testRealDASHDownloadMergeAndOfflinePlayback]
